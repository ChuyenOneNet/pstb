plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.onenet.tbps"
    compileSdk = 35
    ndkVersion "28.0.12433566"
            //flutter.ndkVersion

    packagingOptions {
//        jniLibs {
//            excludes += ['**/x86/**', '**/x86_64/**',                 '**/libmodpng.so',
//                         '**/libmodft2.so',
//                         '**/libmodpdfium.so',
//                         '**/libjniPdfium.so',
//                         '**/libtoolChecker.so',
//                         '**/libimage_processing_util_jni.so']
//        }

        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        //pickFirst '**/libc++_shared.so'

//        jniLibs {
//            useLegacyPackaging = true
//        }
        // Exclude problematic libraries if needed
//        exclude 'lib/x86_64/libandroidlame.so'
//        exclude 'lib/x86_64/libucrop.so'
//        exclude 'lib/x86_64/**'
//        exclude "**/lib/x86_64/libc++_shared.so"
//        exclude "**/lib/arm64-v8a/libc++_shared.so"


        //exclude "**/libc++_shared.so"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.onenet.tbps"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true

        proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'),
                'proguard-rules.pro'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a',
                    'x86', 'x86_64'
//            debugSymbolLevel 'FULL'
        }

//        externalNativeBuild {
//            // For ndk-build, instead use the ndkBuild block.
//            cmake {
//                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON", "-DANDROID_STL=c++_shared"
//
//            }
//        }
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
//        debug {
//            keyAlias keystoreProperties['keyAliasDebug']
//            keyPassword keystoreProperties['keyPasswordDebug']
//            storeFile keystoreProperties['storeFileDebug'] ? file(keystoreProperties['storeFileDebug']) : null
//                    storePassword keystoreProperties['storePasswordDebug']
//        }
    }
    buildTypes {
        release {
            minifyEnabled false      // loại bỏ code không dùng
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.debug
            ndk {
//                abiFilters 'armeabi-v7a', 'arm64-v8a','x86_64'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    aaptOptions {
        noCompress "bic"
    }
}

flutter {
    source = "../.."
}

